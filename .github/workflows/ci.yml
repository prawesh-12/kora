name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://kora:kora@localhost:5432/kora
  REDIS_URL: redis://localhost:6379

jobs:
  # Which parts of the tree moved. The benchmark takes 120 scenarios to run, so it
  # only runs when something that changes agent behaviour changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      benchmark: ${{ steps.filter.outputs.benchmark }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "benchmark=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(packages/ai/|packages/tools/|config/|benchmarks/)'; then
            echo "benchmark=true" >> "$GITHUB_OUTPUT"
          else
            echo "benchmark=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora
          POSTGRES_DB: kora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kora -d kora"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every package script wraps itself in `dotenv -e ../../.env`, so the file has
      # to exist even when the values come from the environment.
      - run: cp .env.example .env

      # Stage 1
      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm turbo typecheck

      # The database has to exist before anything that touches it. Migrations run as
      # their own job here exactly as they do in a deploy.
      - name: prepare the database
        run: |
          bash infra/scripts/migrate-job.sh
          pnpm kora seed
          pnpm --filter @kora/mock-commerce migrate
          pnpm --filter @kora/mock-commerce seed

      # `start`, not `dev`. Watch mode reloads whenever a workspace file changes and
      # restarts the service in the middle of a test run.
      - name: start the acme mock commerce service
        run: |
          pnpm --filter @kora/mock-commerce start &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4001/health >/dev/null && exit 0
            sleep 1
          done
          echo "acme did not come up" >&2
          exit 1

      - name: ingest the knowledge base
        run: pnpm kora ingest config/knowledge

      # Stage 2
      - name: unit and integration tests
        run: pnpm test

      # Stage 3
      - name: acceptance scenarios
        run: pnpm kora scenarios

      # Stage 4
      - name: build
        run: pnpm --filter web build

  benchmark:
    needs: [changes, verify]
    if: needs.changes.outputs.benchmark == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora
          POSTGRES_DB: kora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kora -d kora"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env

      # `benchmarks/history.json` is not in the repository. Without the previous run
      # restored there is no baseline, and the "VRR must not drop" gate cannot fire.
      - name: restore the benchmark baseline
        uses: actions/cache@v4
        with:
          path: benchmarks/history.json
          key: kora-bench-${{ github.sha }}
          restore-keys: |
            kora-bench-

      - name: read the baseline
        id: baseline
        run: |
          if [ -f benchmarks/history.json ]; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          h = json.load(open('benchmarks/history.json'))
          print(f"vrr={h['vrr'] * 100:.1f}")
          print(f"passed={h['passed']}/{h['total']}")
          PY
          else
            echo "vrr=" >> "$GITHUB_OUTPUT"
            echo "passed=" >> "$GITHUB_OUTPUT"
          fi

      - name: prepare the database
        run: |
          bash infra/scripts/migrate-job.sh
          pnpm kora seed
          pnpm --filter @kora/mock-commerce migrate
          pnpm --filter @kora/mock-commerce seed

      - name: start the acme mock commerce service
        run: |
          pnpm --filter @kora/mock-commerce start &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4001/health >/dev/null && exit 0
            sleep 1
          done
          echo "acme did not come up" >&2
          exit 1

      - run: pnpm kora ingest config/knowledge

      # The gates inside the runner block the merge on their own: policy compliance
      # below 100%, any injection write, or a VRR below the baseline exits non-zero.
      - name: benchmark
        id: bench
        run: set -o pipefail; pnpm kora bench 2>&1 | tee bench.txt

      - name: comment the delta on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_VRR: ${{ steps.baseline.outputs.vrr }}
          BASELINE_PASSED: ${{ steps.baseline.outputs.passed }}
        run: |
          {
            echo "### Benchmark"
            echo
            if [ -n "$BASELINE_VRR" ]; then
              echo "Baseline: VRR ${BASELINE_VRR}%, ${BASELINE_PASSED} passed."
            else
              echo "No baseline was cached, so this run becomes the baseline."
            fi
            echo
            echo '```'
            tail -c 60000 bench.txt
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
