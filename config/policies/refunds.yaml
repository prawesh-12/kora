key: refunds
version: "1.0.0"
description: Refund rules, plus the actions that never move money
currency: INR
default: require_approval

rules:
  - id: reads_always_allowed
    when:
      action: { in: [get_subscription, get_customer, get_invoice, preview_change, search_knowledge, check_policy] }
    decision: allow
    reason: Reads never move money

  - id: escalation_always_allowed
    when:
      action: { eq: escalate_to_human }
    decision: allow
    reason: Asking a person for help is always allowed

  - id: ticket_always_allowed
    when:
      action: { eq: create_ticket }
    decision: allow
    reason: Recording a follow-up ticket never moves money

  - id: refund_exceeds_refundable
    when:
      action: { eq: create_refund }
      exceedsRefundable: { eq: true }
    decision: deny
    reason: Refund exceeds the amount still refundable on this charge

  - id: refund_outside_window
    when:
      action: { eq: create_refund }
      daysSinceCharge: { gt: 30 }
    decision: deny
    reason: Refunds are available within 30 days of the charge

  - id: refund_high_value
    when:
      action: { eq: create_refund }
      amountMinor: { gte: 500000 }
    decision: require_approval
    reason: High-value refund needs a person

  - id: refund_standard
    when:
      action: { eq: create_refund }
      daysSinceCharge: { lte: 30 }
    decision: allow
    reason: Within window and under threshold
