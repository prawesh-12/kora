key: acme_cancellations
version: "1.0.0"
description: Acme Store cancellation rules
currency: INR
default: require_approval

rules:
  - id: cancel_after_shipment
    when:
      action: { eq: cancel_order }
      orderStatus: { notIn: [placed, confirmed] }
    decision: deny
    reason: An order can only be cancelled before it ships

  - id: cancel_high_value_needs_approval
    when:
      action: { eq: cancel_order }
      orderStatus: { in: [placed, confirmed] }
      amountMinor: { gte: 1000000 }
    decision: require_approval
    reason: Cancelling an order at or above INR 10,000 needs human approval

  - id: cancel_before_shipment
    when:
      action: { eq: cancel_order }
      orderStatus: { in: [placed, confirmed] }
      amountMinor: { lt: 1000000 }
    decision: allow
    reason: The order has not shipped, so it can be cancelled
