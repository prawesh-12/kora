key: acme_refunds
version: "1.0.0"
description: Acme Store refund rules
currency: INR
default: require_approval

rules:
  - id: refund_outside_window
    when:
      action: { eq: create_refund }
      daysSinceDelivery: { gt: 7 }
    decision: deny
    reason: Refunds are available for 7 days from delivery

  - id: refund_order_not_delivered
    when:
      action: { eq: create_refund }
      orderStatus: { notIn: [delivered] }
    decision: deny
    reason: Only a delivered order can be refunded

  - id: refund_already_refunded
    when:
      action: { eq: create_refund }
      fullyRefunded: { eq: true }
    decision: deny
    reason: This order has already been refunded in full

  - id: refund_exceeds_remaining
    when:
      action: { eq: create_refund }
      exceedsRemaining: { eq: true }
    decision: deny
    reason: The requested amount is more than what is left to refund on this order

  - id: refund_non_refundable_category
    when:
      action: { eq: create_refund }
      itemCategory: { in: [gift_card, perishable, digital] }
    decision: deny
    reason: This item category cannot be refunded

  - id: refund_high_value_needs_approval
    when:
      action: { eq: create_refund }
      requestedAmountMinor: { gte: 500000 }
    decision: require_approval
    reason: Refunds at or above INR 5,000 need human approval

  - id: refund_standard
    when:
      action: { eq: create_refund }
      requestedAmountMinor: { lt: 500000 }
      daysSinceDelivery: { lte: 7 }
      orderStatus: { eq: delivered }
      fullyRefunded: { eq: false }
      exceedsRemaining: { eq: false }
    decision: allow
    reason: Within the standard refund policy
