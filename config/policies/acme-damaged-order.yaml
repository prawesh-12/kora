key: acme_damaged_order
version: "1.0.0"
description: Acme Store damaged item replacement rules
currency: INR
default: require_approval

rules:
  - id: reads_always_allowed
    when:
      action: { in: [get_order, get_customer, search_knowledge, check_policy] }
    decision: allow
    reason: Read-only action

  - id: escalation_always_allowed
    when:
      action: { eq: escalate_to_human }
    decision: allow
    reason: Escalation is always permitted

  - id: outside_return_window
    when:
      action: { eq: create_replacement }
      daysSinceDelivery: { gt: 7 }
    decision: deny
    reason: Replacements are available for 7 days from delivery

  - id: non_returnable_category
    when:
      action: { eq: create_replacement }
      itemCategory: { in: [gift_card, perishable, digital] }
    decision: deny
    reason: This item category cannot be replaced

  - id: already_replaced
    when:
      action: { eq: create_replacement }
      alreadyReplaced: { eq: true }
    decision: deny
    reason: A replacement already exists for this order

  - id: order_not_delivered
    when:
      action: { eq: create_replacement }
      orderStatus: { notIn: [delivered] }
    decision: deny
    reason: Only delivered orders can be reported as damaged

  - id: high_value_needs_approval
    when:
      action: { eq: create_replacement }
      amountMinor: { gte: 500000 }
    decision: require_approval
    reason: Replacements at or above INR 5,000 need human approval

  - id: standard_replacement
    when:
      action: { eq: create_replacement }
      amountMinor: { lt: 500000 }
      daysSinceDelivery: { lte: 7 }
      orderStatus: { eq: delivered }
    decision: allow
    reason: Within the standard damaged item replacement policy
